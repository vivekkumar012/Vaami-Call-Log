name: Deploy

# On every push to main: D1 migrations -> deploy Worker -> build + deploy Pages
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker deps
        working-directory: worker
        run: npm install

      - name: Apply D1 migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply call-log-db --remote

      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.WORKER_URL }}
          NEXT_PUBLIC_BOT_URL: ${{ vars.BOT_URL || 'http://localhost:7860' }}

      - name: Deploy Pages
        working-directory: frontend
        run: npx --yes wrangler@4 pages deploy out --project-name=${{ vars.PAGES_PROJECT || 'call-log' }} --branch=main